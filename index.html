<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<title>Wren</title>
<meta name="description" content="Wren — a dating prototype. Swipe, match, and talk." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#FAF7F2" />
<style>
/* ==========================================================================
   WREN — design tokens
   One accent (clay), warm neutral ground, serif display over sans body.
   Light and dark are the same token names with different values, so every
   component is written once. Nothing below hardcodes a colour.
   ========================================================================== */
:root {
  --bg:          #FAF7F2;
  --bg-sunk:     #F2ECE2;
  --surface:     #FFFFFF;
  --surface-2:   #F6F1E9;
  --line:        #E7DFD3;
  --line-strong: #D6CBB9;
  --ink:         #221F1B;
  --ink-2:       #5F574E;
  --ink-3:       #746C60;
  --accent:      #A8452A;
  --accent-soft: #F6E7DF;
  --on-accent:   #FFF9F5;
  --ok:          #2F6B4F;
  --warn:        #8A5A12;
  --danger:      #A32B2B;
  --like:        #A8452A;
  --nope:        #6E6660;
  --super:       #8A5A12;
  --verify:      #2C6BD1;
  --scrim:       rgba(34, 31, 27, .58);
  --shadow-1:    0 1px 2px rgba(34,31,27,.05), 0 6px 16px rgba(34,31,27,.06);
  --shadow-2:    0 2px 6px rgba(34,31,27,.07), 0 20px 48px rgba(34,31,27,.14);
  --frame-bg:    #EFE9DF;

  --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px; --r-full: 999px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --tap: 44px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-out: cubic-bezier(.16,1,.3,1);
  --dur: 220ms;
  --bar-h: 58px;
}
[data-theme="dark"] {
  --bg:          #141210;
  --bg-sunk:     #0E0C0A;
  --surface:     #1E1B17;
  --surface-2:   #26221C;
  --line:        #322D26;
  --line-strong: #453E35;
  --ink:         #F4EFE7;
  --ink-2:       #B5AB9E;
  --ink-3:       #968C7F;
  --accent:      #E08A5F;
  --accent-soft: #33221A;
  --on-accent:   #241109;
  --ok:          #7FC79B;
  --warn:        #D6A75A;
  --danger:      #E08A85;
  --like:        #E08A5F;
  --nope:        #9A9187;
  --super:       #D6A75A;
  --verify:      #6FA3F0;
  --scrim:       rgba(10, 9, 8, .72);
  --shadow-1:    0 1px 2px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.34);
  --shadow-2:    0 2px 6px rgba(0,0,0,.45), 0 20px 48px rgba(0,0,0,.5);
  --frame-bg:    #0B0A09;
}

/* ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1,h2,h3,h4,p,ul,ol,figure,fieldset,legend { margin: 0; padding: 0; }
ul,ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
legend { padding: 0; }
img { display: block; max-width: 100%; }
button,input,select,textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
svg { flex: none; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.serif { font-family: var(--serif); font-weight: 400; letter-spacing: -.01em; }
.tnum { font-variant-numeric: tabular-nums; }

/* ==========================================================================
   App shell — a 390pt reference column, framed on larger screens.
   ========================================================================== */
.app {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 440px;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
  overflow: hidden;
}
@media (min-width: 760px) {
  body { background: var(--frame-bg); padding: 20px 0; }
  .app { min-height: calc(100dvh - 40px); border-radius: var(--r-xl); border: 1px solid var(--line); box-shadow: var(--shadow-2); }
}
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

/* Top bar ------------------------------------------------------------------ */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  padding-top: max(10px, env(safe-area-inset-top));
  min-height: calc(var(--bar-h) + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
.topbar__t { font-family: var(--serif); font-size: 24px; line-height: 1.1; flex: 1; min-width: 0; }
.topbar__t small { display: block; font-family: var(--sans); font-size: 12px; color: var(--ink-3); letter-spacing: .01em; }
.brand { display: flex; align-items: center; gap: 7px; font-family: var(--serif); font-size: 21px; }
.brand__m { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

/* Bottom tab bar ----------------------------------------------------------- */
.tabs {
  display: grid; grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 30;
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: var(--tap); padding: 7px 4px 8px;
  color: var(--ink-3); font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
  position: relative;
  transition: color var(--dur) var(--ease);
}
.tab[aria-selected="true"] { color: var(--accent); }
.tab__badge {
  position: absolute; top: 4px; left: 50%; margin-left: 5px;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: var(--r-full); background: var(--accent); color: var(--on-accent);
  font-size: 10px; font-weight: 700; line-height: 17px; text-align: center;
}

/* ==========================================================================
   Buttons & controls
   ========================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--tap); padding: 0 18px;
  border-radius: var(--r-full);
  background: var(--surface-2); color: var(--ink);
  font-size: 15px; font-weight: 600; letter-spacing: -.01em;
  border: 1px solid transparent;
  transition: transform 120ms var(--ease), background var(--dur) var(--ease), opacity var(--dur);
}
.btn:active { transform: scale(.975); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn--primary { background: var(--accent); color: var(--on-accent); }
.btn--primary:disabled { background: var(--accent); }
.btn--ghost { background: transparent; border-color: var(--line-strong); color: var(--ink); }
.btn--quiet { background: transparent; color: var(--ink-2); }
.btn--danger { background: transparent; border-color: var(--line-strong); color: var(--danger); }
.btn--block { width: 100%; }
.btn--lg { min-height: 52px; font-size: 16px; padding: 0 24px; }
.btn--sm { min-height: var(--tap); padding: 0 14px; font-size: 13.5px; }

.iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: var(--tap); height: var(--tap);
  border-radius: 50%;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
  transition: transform 120ms var(--ease), background var(--dur) var(--ease);
}
.iconbtn:active { transform: scale(.94); }
.iconbtn--flat { box-shadow: none; background: transparent; border-color: transparent; }
.iconbtn--on { color: var(--accent); }
.iconbtn--fill {
  background: var(--ink); color: var(--bg); border-color: transparent;
  box-shadow: var(--shadow-2);
}
.iconbtn--fill svg { color: currentColor; }
.iconbtn[disabled] { opacity: .38; pointer-events: none; }

/* Segmented control -------------------------------------------------------- */
.seg { display: flex; gap: 4px; padding: 4px; background: var(--bg-sunk); border-radius: var(--r-full); }
.seg__i {
  flex: 1; min-height: 38px; padding: 0 10px; border-radius: var(--r-full);
  font-size: 13.5px; font-weight: 600; color: var(--ink-2);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg__i[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* Chips -------------------------------------------------------------------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 38px; padding: 0 14px; border-radius: var(--r-full);
  background: var(--surface-2); color: var(--ink-2);
  font-size: 13.5px; font-weight: 600;
  border: 1px solid transparent;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 34%, transparent); }
.chip__x { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: color-mix(in srgb, currentColor 16%, transparent); }

/* Fields ------------------------------------------------------------------- */
.field { display: block; margin-bottom: 16px; }
.field__l { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 7px; letter-spacing: .01em; }
.field__hint { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.input, .textarea, .select {
  width: 100%; min-height: 50px; padding: 13px 15px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line-strong); border-radius: var(--r-md);
  font-size: 16px; /* 16px stops iOS zooming on focus */
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
.select { appearance: none; background-image: none; padding-right: 40px; }
.selectwrap { position: relative; }
.selectwrap svg { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* Switch ------------------------------------------------------------------- */
.switch { display: flex; align-items: center; gap: 12px; min-height: var(--tap); width: 100%; text-align: left; }
.switch__t { flex: 1; min-width: 0; font-size: 15px; }
.switch__t small { display: block; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
.switch__k { flex: none; width: 50px; height: 30px; border-radius: var(--r-full); background: var(--line-strong); position: relative; transition: background var(--dur) var(--ease); }
.switch__k::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-1); transition: transform var(--dur) var(--ease-out); }
.switch[aria-checked="true"] .switch__k { background: var(--accent); }
.switch[aria-checked="true"] .switch__k::after { transform: translateX(20px); }

/* Dual-thumb range --------------------------------------------------------- */
.dual { position: relative; height: var(--tap); display: flex; align-items: center; }
.dual__track { position: absolute; left: 0; right: 0; height: 5px; border-radius: var(--r-full); background: var(--bg-sunk); }
.dual__fill { position: absolute; height: 100%; border-radius: var(--r-full); background: var(--accent); }
.dual__in {
  position: absolute; left: 0; width: 100%; height: var(--tap); margin: 0;
  background: none; pointer-events: none; appearance: none;
}
.dual__in::-webkit-slider-thumb { appearance: none; pointer-events: auto; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: var(--shadow-1); cursor: grab; }
.dual__in::-moz-range-thumb { pointer-events: auto; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: var(--shadow-1); cursor: grab; }
.dual__in::-webkit-slider-runnable-track { background: none; height: var(--tap); }
.dual__in::-moz-range-track { background: none; height: var(--tap); }
.dual__out { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-top: 2px; }

/* Single range ------------------------------------------------------------- */
.range { width: 100%; height: var(--tap); appearance: none; background: none; margin: 0; }
.range::-webkit-slider-runnable-track { height: 5px; border-radius: var(--r-full); background: var(--bg-sunk); }
.range::-moz-range-track { height: 5px; border-radius: var(--r-full); background: var(--bg-sunk); }
.range::-webkit-slider-thumb { appearance: none; margin-top: -11px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: var(--shadow-1); }
.range::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: var(--shadow-1); }

/* ==========================================================================
   Generic blocks
   ========================================================================== */
.pad { padding: 16px 18px; }
.pad-b { padding-bottom: 28px; }
.h1 { font-family: var(--serif); font-size: 30px; line-height: 1.12; letter-spacing: -.015em; }
.h2 { font-family: var(--serif); font-size: 22px; line-height: 1.2; letter-spacing: -.01em; }
.lede { color: var(--ink-2); font-size: 15px; margin-top: 7px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.stack > * + * { margin-top: 14px; }
.stack-s > * + * { margin-top: 8px; }
.stack-l > * + * { margin-top: 24px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.card--pad { padding: 18px; }
.card--flat { box-shadow: none; }

.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 12px; }
.sec-title h2 { font-family: var(--serif); font-size: 19px; }
.sec-title a, .sec-title button { font-size: 13.5px; font-weight: 600; color: var(--accent); }

.listrow {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 60px; padding: 11px 14px; text-align: left;
  border-bottom: 1px solid var(--line);
  transition: background var(--dur) var(--ease);
}
.listrow:last-child { border-bottom: 0; }
.listrow:active { background: var(--surface-2); }
.listrow__t { flex: 1; min-width: 0; }
.listrow__t b { display: block; font-size: 15px; font-weight: 600; }
.listrow__t small { display: block; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listrow__r { flex: none; text-align: right; font-size: 12.5px; color: var(--ink-3); }

.avatar { position: relative; display: inline-block; flex: none; border-radius: 50%; overflow: hidden; background: var(--bg-sunk); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar--28 { width: 28px; height: 28px; }
.avatar--40 { width: 40px; height: 40px; }
.avatar--52 { width: 52px; height: 52px; }
.avatar--lg { width: 76px; height: 76px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 22px; padding: 0 8px; border-radius: var(--r-full);
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
  background: var(--surface-2); color: var(--ink-2);
}
.badge--ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.badge--warn { background: color-mix(in srgb, var(--warn) 17%, transparent); color: var(--warn); }
.badge--accent { background: var(--accent-soft); color: var(--accent); }
.badge--verify { background: var(--verify); color: #fff; border-radius: 50%; width: 18px; height: 18px; padding: 0; justify-content: center; }

.note { display: flex; gap: 10px; padding: 13px 15px; border-radius: var(--r-md); background: var(--surface-2); font-size: 13px; color: var(--ink-2); }
.note svg { color: var(--ink-3); margin-top: 1px; }

/* Empty states ------------------------------------------------------------- */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 46px 30px; }
.empty__art { width: 116px; height: 116px; margin-bottom: 20px; color: var(--ink-3); opacity: .8; }
.empty h2 { font-family: var(--serif); font-size: 23px; margin-bottom: 8px; }
.empty p { color: var(--ink-2); font-size: 14.5px; max-width: 32ch; }
.empty .btn { margin-top: 22px; }

/* ==========================================================================
   Deck — the swipe surface
   ========================================================================== */
.deckwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.dcard--top { touch-action: none; }
/* The top card owns every gesture it starts. Without this the browser claims
   the drag for panning and fires pointercancel, which kills the swipe. The
   discover tab has no scroll container of its own, so nothing is lost. */
.deck { position: relative; flex: 1; min-height: 0; margin: 10px 14px 6px; touch-action: pan-y; }
.dcard {
  position: absolute; inset: 0;
  background: var(--surface); border-radius: var(--r-xl);
  box-shadow: var(--shadow-1);
  overflow: hidden;
  display: flex; flex-direction: column;
  will-change: transform;
}
/* Images are natively draggable, which makes the browser start an HTML5 drag
   mid-swipe and fire pointercancel. Opt every image out of dragging, and let
   card taps fall through the photo to the card itself. */
img { -webkit-user-drag: none; user-select: none; }
.dcard img, .dcard__media { -webkit-user-drag: none; user-select: none; }
.dcard__media img { pointer-events: none; }
.dcard--next { transform: scale(.955) translateY(14px); }
.dcard--next2 { transform: scale(.91) translateY(28px); }
.dcard--top { cursor: grab; }
.dcard--top:active { cursor: grabbing; }
.dcard--gone { pointer-events: none; }

.dcard__media { position: relative; flex: 1; min-height: 0; background: var(--bg-sunk); }
.dcard__media img { width: 100%; height: 100%; object-fit: cover; }
.dcard__grad { position: absolute; inset: auto 0 0 0; height: 54%; background: linear-gradient(to top, rgba(20,18,16,.85), rgba(20,18,16,.76) 42%, rgba(20,18,16,.42) 68%, transparent); pointer-events: none; }
.dcard__pips { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 4px; }
.dcard__pip { flex: 1; height: 3px; border-radius: var(--r-full); background: rgba(255,255,255,.34); transition: background var(--dur) var(--ease); }
.dcard__pip--on { background: #fff; }

.dcard__info { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 18px; color: #fff; }
.dcard__name { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 27px; line-height: 1.1; }
.dcard__name .badge--verify { box-shadow: 0 0 0 2px rgba(20,18,16,.5); }
.dcard__meta { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: rgba(255,255,255,.9); margin-top: 5px; }
.dcard__prompt { margin-top: 11px; font-family: var(--serif); font-size: 15px; line-height: 1.4; color: rgba(255,255,255,.94); }
.dcard__prompt b { display: block; font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.8); margin-bottom: 3px; }
.dcard__tap { margin-top: 10px; font-size: 12px; color: rgba(255,255,255,.8); display: flex; align-items: center; gap: 5px; }

.dcard__stamp {
  position: absolute; top: 26px; z-index: 5;
  padding: 7px 15px; border-radius: var(--r-sm);
  font-size: 21px; font-weight: 800; letter-spacing: .1em;
  border: 3px solid currentColor; opacity: 0;
  pointer-events: none; transition: opacity 90ms linear;
  background: rgba(255,255,255,.14); backdrop-filter: blur(3px);
}
.dcard__stamp--like { left: 20px; color: #fff; background: color-mix(in srgb, var(--like) 82%, transparent); transform: rotate(-13deg); }
.dcard__stamp--nope { right: 20px; color: #fff; background: color-mix(in srgb, var(--nope) 82%, transparent); transform: rotate(13deg); }
.dcard__stamp--super { left: 50%; top: 50%; margin: -26px 0 0 -68px; color: #fff; background: color-mix(in srgb, var(--super) 86%, transparent); transform: rotate(-4deg); }

.dcard__liked {
  position: absolute; top: 12px; right: 12px; z-index: 5;
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(20,18,16,.5); color: #fff; backdrop-filter: blur(4px);
}

/* fly-out */
.dcard--fly { transition: transform 300ms cubic-bezier(.4,.05,.6,1), opacity 300ms linear; }
.dcard--fly-r { transform: translate3d(150%,6%,0) rotate(22deg) !important; opacity: 0; }
.dcard--fly-l { transform: translate3d(-150%,6%,0) rotate(-22deg) !important; opacity: 0; }
.dcard--fly-u { transform: translate3d(0,-135%,0) rotate(6deg) scale(1.06) !important; opacity: 0; }
.dcard--snap { transition: transform 300ms var(--ease-out); }

.deckbar {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
}
.deckbar .iconbtn--big { width: 58px; height: 58px; }
.deckbar .iconbtn--nope { color: var(--nope); }
.deckbar .iconbtn--like { color: var(--like); }
.deckbar .iconbtn--super { color: var(--super); }

  if (s.length <= n) return s;
  const cut = s.slice(0, n);
  return cut.slice(0, cut.lastIndexOf(" ")).replace(/[,.…]+$/, "") + "…";
}
function toast(msg, ic) {
  state.ui.toast = { msg: msg, ic: ic || "check" };
  render();
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { state.ui.toast = null; render(); }, 2400);
}

const STEPS = ["Verify", "Photos", "About you", "Prompts"];

function obValid(step) {
  const m = state.me;
  /* step 0 is also "valid" once a contact is typed, because the button is
     what sends the code in the first place */
  if (step === 0) return m.verified || m.contact.trim().length > 0;
  if (step === 1) return m.photos.length >= 2;
  if (step === 2) return m.name.trim().length > 0 && m.age >= 18 && m.age <= 99;
  if (step === 3) return m.prompts.length === 3 && m.prompts.every((p) => p.a.trim());
  return true;
}
function ctaLabel() {
  const m = state.me, s = state.step;
  if (s === 3) return "Finish and start swiping";
  if (s === 0) {
    if (m.verified) return "Continue";
    return state.form.sent ? "Verify" : "Send me a code";
  }
  return "Continue";
}
/* Typing must not re-render (that would steal focus), so the call to action is
   refreshed in place instead. */
function syncCta() {
  const b = $('[data-act="onext"]');
  if (!b) return;
  b.disabled = !obValid(state.step);
  b.textContent = ctaLabel();
  save();
}

  } else if (k === "age") state.me.age = v;
  else if (["gender", "orientation", "lookingFor"].indexOf(k) !== -1) state.me[k] = v;

}

  if (state.ui.chat) { const log = $(".chat__log"); if (log) log.scrollTop = log.scrollHeight; }
  if (state.tab === "discover" && !state.ui.viewing && !state.ui.chat && !state.ui.sheet) {

/* ---- drag physics ------------------------------------------------------- */
let drag = null, lastDragEnd = 0;
function bindDeck() {
  const deck = $("#deck");
  if (!deck) return;
  const card = $(".dcard--top", deck);
  if (!card) return;

  card.addEventListener("pointerdown", (e) => {
    if (e.button != null && e.button !== 0) return;
    if (e.target.closest(".dcard__stamp")) return;
    drag = { el: card, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, t0: performance.now(), moved: false };
    try { card.setPointerCapture(e.pointerId); } catch (_) {}
  });
  card.addEventListener("pointermove", (e) => {
    if (!drag) return;
    drag.dx = e.clientX - drag.x0;
    drag.dy = e.clientY - drag.y0;
    if (!drag.moved && Math.hypot(drag.dx, drag.dy) > 7) drag.moved = true;
    if (!drag.moved) return;
    e.preventDefault();
    const w = card.offsetWidth || 1;
    const rot = Math.max(-20, Math.min(20, (drag.dx / w) * 28));
    card.style.transform = `translate3d(${drag.dx}px,${drag.dy * 0.6}px,0) rotate(${rot}deg)`;
    const like = $(".dcard__stamp--like", card), nope = $(".dcard__stamp--nope", card), sup = $(".dcard__stamp--super", card);
    const horizontal = Math.abs(drag.dx) > Math.abs(drag.dy) * 1.15;
    if (like) like.style.opacity = horizontal && drag.dx > 0 ? Math.min(1, drag.dx / 90) : 0;
    if (nope) nope.style.opacity = horizontal && drag.dx < 0 ? Math.min(1, -drag.dx / 90) : 0;
    if (sup) sup.style.opacity = !horizontal && drag.dy < 0 ? Math.min(1, -drag.dy / 80) : 0;
  });
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null;
    const card2 = d.el;
    if (!d.moved) return;                       // a tap: let the click handler open the profile
    lastDragEnd = Date.now();
    const w = card2.offsetWidth || 1;
    const dt = Math.max(1, performance.now() - d.t0);
    const vx = Math.abs(d.dx) / dt;             // px per ms
    const horizontal = Math.abs(d.dx) > Math.abs(d.dy) * 1.15;
    const far = Math.abs(d.dx) > w * 0.3;
    const fast = vx > 0.55;

    let dir = null;
    if (horizontal && (far || (fast && Math.abs(d.dx) > 40))) dir = d.dx > 0 ? "like" : "pass";
    else if (!horizontal && d.dy < -(w * 0.3) && (Math.abs(d.dy) > 90 || vx > 0.5)) dir = "super";

    if (dir) {
      if ((dir === "like" || dir === "super") && atLimit()) {
        card2.classList.add("dcard--snap");
        card2.style.transform = "";
        state.ui.sheet = "limit"; save(); render();
        return;
      }
      flyOut(dir);
    } else {
      card2.classList.add("dcard--snap");
      card2.style.transform = "";
      setTimeout(() => card2 && card2.classList.remove("dcard--snap"), 320);
    }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
  card.addEventListener("lostpointercapture", end);
  return true;
}

function flyOut(dir) {
  const card = $(".dcard--top");
  if (!card) return;
  card.classList.add("dcard--fly");
  card.classList.add(dir === "like" ? "dcard--fly-r" : dir === "pass" ? "dcard--fly-l" : "dcard--fly-u");
  setTimeout(() => applySwipe(card.dataset.id, dir), 300);
}

function likedCount(pid) { return Object.keys(state.likedItems).filter((k) => k.indexOf(pid + ":") === 0).length; }

function applySwipe(id, dir) {
  const p = P(id);
  if (!p) return;
  cancelPendingMatch();
  if (dir !== "pass") {
    if (atLimit()) { state.ui.sheet = "limit"; save(); render(); return; }
    state.likesUsed++;
  }
  let matchId = null;
  if (dir !== "pass" && p.likesYou && !blocked(p.id)) {
    const m = {
      id: "m" + now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
      pid: id, at: now(), expires: now() + MATCH_TTL, msgs: [], unread: 0, firstMsg: false, gifts: [],
      likedItems: likedCount(id), likedDir: dir,
    };
    state.matches.unshift(m);
    matchId = m.id;
  }
  state.swiped.push({ id: id, dir: dir, matchId: matchId });
  state.order = state.order.filter((x) => x !== id);
  state.ui.viewing = null;
  save();
  render();
  if (matchId) matchTimer = setTimeout(() => { matchTimer = null; if (state.ui.match === null) { state.ui.match = matchId; render(); } }, 400);
}

function undo() {
  cancelPendingMatch();
  const last = state.swiped.pop();
  if (!last) return;
  if (last.dir !== "pass") state.likesUsed = Math.max(0, state.likesUsed - 1);
  if (last.matchId) state.matches = state.matches.filter((m) => m.id !== last.matchId);
  state.order.unshift(last.id);
  state.ui.match = null;
  save();
  render();
  toast("Last swipe undone", "undo");
}

const REPLIES = [

function sendMsg(text, kind, label) {
  const m = state.matches.find((x) => x.id === state.ui.chat);

  const body = (text != null ? text : state.ui.chatDraft).trim();
  if (!body && kind !== "gif") return;
  m.msgs.push(kind === "gif" ? { from: "me", kind: "gif", label: label, at: now() } : { from: "me", text: body, at: now() });

    m.typing = true;

    setTimeout(() => {

      if (!m2) return;
      m2.typing = false;
      m2.msgs.push({ from: "them", text: REPLIES[Math.floor(Math.random() * REPLIES.length)], at: now() });
      m2.unread = state.ui.chat === mid ? 0 : (m2.unread || 0) + 1;
      save();
      render();
    }, 1500);
  }, 900);
}

        <span class="selectwrap"><select class="select" onchange="setS('visibility', this.value)">
          ${["everyone", "verified", "matches"].map((v) => `<option value="${v}" ${(state.settings.visibility || "everyone") === v ? "selected" : ""}>${visLabel(v)}</option>`).join("")}
        </select>${icon("right", 16, 'style="transform:rotate(90deg)"')}</span>
      </label>
      <button class="listrow" style="padding-left:0;padding-right:0;border-bottom:0" data-act="sheet" data-v="blocks">
        <span class="listrow__t"><b>Blocked people</b><small>${state.blocks.length ? state.blocks.length + " blocked" : "Nobody blocked"}</small></span>
        ${icon("right", 18)}
      </button>
    </div>
  </div>

  <div class="sec-title pad" style="padding-bottom:0"><h2>Preferences: messaging</h2></div>
  <div class="pad" style="padding-top:10px">
    <div class="card card--pad">
      <label class="field" style="margin-bottom:4px">
        <span class="field__l">Who messages first</span>
        <span class="selectwrap"><select class="select" onchange="setS('msgFirst', this.value)">
          <option value="anyone" ${state.settings.msgFirst === "anyone" ? "selected" : ""}>Anyone — both sides can write first</option>
          <option value="women" ${state.settings.msgFirst === "women" ? "selected" : ""}>Only women message first</option>
          <option value="men" ${state.settings.msgFirst === "men" ? "selected" : ""}>Only men message first</option>
          <option value="nonbinary" ${state.settings.msgFirst === "nonbinary" ? "selected" : ""}>Only non-binary people message first</option>
        </select>${icon("right", 16, 'style="transform:rotate(90deg)"')}</span>
        <span class="field__hint">Default is anyone, so a match never stalls. Turn on a Bumble-style rule and matches where you are not in the first group wait for the other person.</span>
      </label>
    </div>
  </div>

  <div class="sec-title pad" style="padding-bottom:0"><h2>Prototype settings</h2></div>
  <div class="pad" style="padding-top:10px">
    <div class="card card--pad">
      <div style="display:flex;align-items:center;gap:12px">
        <span class="listrow__t"><b>Appearance</b><small>${state.settings.theme === "light" ? "Light" : "Dark"}</small></span>
        <button class="btn btn--sm" data-act="theme">${state.settings.theme === "light" ? "Dark" : "Light"}</button>
      </div>
      <button class="switch" style="margin-top:6px" data-act="remote" role="switch" aria-checked="${!!state.settings.remotePhotos}">
        <span class="switch__t">Use remote demo photos<small>Attempts real image URLs, falls back to generated art if they fail. Needs a network connection.</small></span>
        <span class="switch__k"></span>
      </button>
    </div>
  </div>

  <div class="sec-title pad" style="padding-bottom:0"><h2>Danger zone</h2></div>
  <div class="pad" style="padding-top:10px;padding-bottom:0">
    <div class="card card--pad dangerzone">
      <h3 style="font-size:16px;margin-bottom:6px">Reset the demo</h3>
      <p class="field__hint" style="margin-bottom:12px">Clears matches, swipes, photos, prompts and the like counter stored in this browser, and restarts onboarding.</p>
      <button class="btn btn--danger btn--block" data-act="reset">${state.ui.confirmReset ? "Tap again to confirm" : "Reset everything"}</button>
    </div>
    <p class="field__hint" style="padding:20px 2px 0;text-align:center">${esc(APP_NAME)} is a UI prototype. No payments, no geolocation, no server, no real uploads. Photos are generated art.</p>
  </div>`;
}

/* ==========================================================================
   Sheets
   ========================================================================== */
function sheet(title, body, footer) {
  return `<div class="sheet" data-act="sheet-bg">
    <div class="sheet__p" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <span class="sheet__g"></span>
      <div class="sheet__h">
        <h2>${esc(title)}</h2>
        <button class="iconbtn iconbtn--flat" data-act="sheet-close" aria-label="Close">${icon("x", 20)}</button>
      </div>
      <div class="sheet__b">${body}</div>
      ${footer ? `<div class="sheet__f">${footer}</div>` : ""}
    </div>
  </div>`;
}
const REASONS = [
  "Inappropriate or sexual content", "Harassment or hate speech",
  "Fake profile or impersonation", "They seem to be under 18",
  "Scam, spam or solicitation", "Something else",
];
function viewReport(pid) {
  const p = P(pid);
  return sheet(`Report ${p ? p.name.split(" ")[0] : "profile"}`, `
    <p class="field__hint" style="margin-bottom:14px">Reports go to safety review. The profile is hidden from you straight away and will not come back.</p>
    ${REASONS.map((r, i) => `<button class="opt" data-act="doreport" data-v="${esc(pid)}" data-r="${i}">
      <span class="opt__t">${esc(r)}</span><span class="opt__m">${icon("check", 12, 'style="stroke-width:3"')}</span></button>`).join("")}`,
    `<button class="btn btn--block btn--danger" data-act="block" data-v="${esc(pid)}">Block instead</button>`);
}
function viewChatMenu(mid) {
  const m = state.matches.find((x) => x.id === mid);
  const p = m ? P(m.pid) : null;
  return sheet(p ? p.name.split(" ")[0] : "Match", `
    <button class="opt" data-act="reverify"><span class="opt__t">Ask for a fresh selfie<small>Requests live photo reverification</small></span>${icon("shield", 20)}</button>
    <button class="opt" data-act="report" data-v="${p ? p.id : ""}"><span class="opt__t">Report this person<small>${esc(REASONS[0].toLowerCase())}, and more</small></span>${icon("flag", 20)}</button>
    <button class="opt" data-act="unmatch" data-v="${esc(mid)}"><span class="opt__t">Unmatch<small>Removes the match without reporting</small></span>${icon("x", 20)}</button>
    <button class="opt" data-act="block" data-v="${p ? p.id : ""}"><span class="opt__t">Block<small>They will not appear again</small></span>${icon("block", 20)}</button>`,
    `<button class="btn btn--block" data-act="sheet-close">Cancel</button>`);
}
function viewBlocks() {
  const body = state.blocks.length
    ? state.blocks.map((id) => {
        const p = P(id);
        if (!p) return "";
        return `<div class="listrow">
          <span class="avatar avatar--40">${photoImg(p, 0, p.name)}</span>
          <span class="listrow__t"><b>${esc(p.name)}</b><small>Blocked</small></span>
          <button class="btn btn--sm" data-act="unblock" data-v="${esc(id)}">Unblock</button>
        </div>`;
      }).join("")
    : `<div class="empty" style="padding:34px 12px">
        <span class="empty__art" style="width:82px;height:82px">${icon("shield", 82, 'style="stroke-width:.9"')}</span>
        <h2 style="font-size:19px">Nobody blocked</h2>
        <p>People you block never reappear in your deck, and any match with them is removed.</p>
      </div>`;
  return sheet("Blocked people", body, `<button class="btn btn--block" data-act="sheet-close">Done</button>`);
}
function viewPickPrompt(idx) {
  const cur = state.me.prompts[+idx];
  return sheet("Choose a prompt", PROMPT_BANK.map((q) => `<button class="opt" data-act="chose" data-v="${esc(q)}" data-i="${esc(idx)}" aria-pressed="${!!cur && cur.q === q}">
      <span class="opt__t">${esc(q)}</span><span class="opt__m">${icon("check", 12, 'style="stroke-width:3"')}</span></button>`).join(""),
    `<button class="btn btn--block" data-act="sheet-close">Cancel</button>`);
}
function limitModal() {
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="lim">
    <div class="match">
      <div style="width:92px;height:92px;margin:0 auto 20px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;color:#fff">${icon("heart", 44, 'style="fill:currentColor"')}</div>
      <h2 id="lim">That's ${LIKE_LIMIT} for today</h2>
      <p>Your daily like limit resets at midnight. Passing still works, and you can undo any swipe.</p>
      <div class="match__acts">
        <button class="btn btn--primary btn--lg" data-act="limit-ok">Keep browsing</button>
        <button class="btn btn--lg" data-act="upgrade">Upgrade to ${esc(APP_NAME)} Plus</button>
      </div>
      <p class="match__exp">Payments are out of scope for this prototype — no card is asked for and nothing is charged.</p>
    </div>
  </div>`;
}
function viewSheet() {
  const s = state.ui.sheet;
  if (!s) return "";
  if (s === "filters") return viewFilters();
  if (s === "limit") return limitModal();
  if (s === "report") return viewReport(state.ui.reportPid);
  if (s === "chatmenu") return viewChatMenu(state.ui.chatMenuId);
  if (s === "blocks") return viewBlocks();
  if (s === "pickprompt") return viewPickPrompt(state.ui.pickIndex);
  return "";
}
function viewToast() {
  if (!state.ui.toast) return "";
  return `<div class="toast" role="status">${icon(state.ui.toast.ic, 17)}<span>${esc(state.ui.toast.msg)}</span></div>`;
}

/* ==========================================================================
   Actions
   ========================================================================== */
function runSelfie() {
  state.me.selfieState = "scan";
  save(); render();
  setTimeout(() => {
    state.me.selfie = true;
    state.me.selfieState = "done";
    save(); render();
    toast("Selfie verified — blue check added", "shield");
  }, 1400);
}
function doReport(pid, reason) {
  state.reports.push({ pid: pid, reason: reason, at: now() });
  const m = matchFor(pid);
  if (m) { state.matches = state.matches.filter((x) => x.id !== m.id); if (state.ui.chat === m.id) state.ui.chat = null; }
  state.order = state.order.filter((x) => x !== pid);
  state.ui.sheet = null; state.ui.viewing = null; state.ui.match = null;
  save(); render();
  toast("Report sent. Profile hidden.", "shield");
}
function blockProfile(pid) {
  if (!pid) return;
  if (state.blocks.indexOf(pid) === -1) state.blocks.push(pid);
  const m = matchFor(pid);
  if (m) { state.matches = state.matches.filter((x) => x.id !== m.id); if (state.ui.chat === m.id) state.ui.chat = null; }
  state.order = state.order.filter((x) => x !== pid);
  state.ui.sheet = null; state.ui.viewing = null; state.ui.match = null;
  save(); render();
  toast("Blocked. They will not appear again.", "block");
}
function setS(k, v) { state.settings[k] = v; save(); render(); }

/* ==========================================================================
   Events
   ========================================================================== */
function onClick(e) {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;

  switch (act) {
    case "tab": state.tab = v; state.ui.sheet = null; save(); render(); break;
    case "theme": state.settings.theme = state.settings.theme === "light" ? "dark" : "light"; applyTheme(); save(); render(); break;

    /* onboarding */
    case "ckind": state.me.contactKind = v; save(); render(); break;
    case "oback": state.step = Math.max(0, state.step - 1); save(); render(); break;
    case "padd":
      if (state.me.photos.length >= 6) { toast("Six photos is the maximum", "info"); break; }
      state.me.photos.push(portrait("me:" + now()));
      save(); render(); break;
    case "pdel":
      if (state.me.photos.length <= 2) { toast("Two photos is the minimum", "info"); break; }
      state.me.photos.splice(+v, 1); save(); render(); break;
    case "pmv": {
      const i = +el.dataset.i, d = +el.dataset.d, j = i + d;
      if (j < 0 || j >= state.me.photos.length) break;
      const t = state.me.photos[i]; state.me.photos[i] = state.me.photos[j]; state.me.photos[j] = t;
      save(); render(); break;
    }
    case "selfie": runSelfie(); break;
    case "ptoggle": {
      const q = el.dataset.q;
      const i = state.me.prompts.findIndex((x) => x.q === q);
      if (i !== -1) state.me.prompts.splice(i, 1);
      else if (state.me.prompts.length < 3) state.me.prompts.push({ q: q, a: "" });
      else { toast("Three prompts is the limit", "info"); break; }
      save(); render(); break;
    }
    case "onext": {
      const s = state.step;
      if (s === 0) {
        if (!state.me.verified) {
          if (!state.form.sent) {
            if (!state.me.contact.trim()) { toast("Enter an email or phone number", "alert"); break; }
            state.form.sent = true; save(); render(); break;
          }
          if (!state.form.code.trim()) { toast("Enter the code we sent you", "alert"); break; }
          state.me.verified = true;
        }
        state.step = 1; save(); render(); break;
      }
      if (!obValid(s)) { toast("Finish this step first", "alert"); break; }
      if (s === 3) { state.onboardDone = true; save(); render(); break; }
      state.step = s + 1; save(); render(); break;
    }

    /* deck */
    case "swipe": {
      if (state.ui.viewing) { const pid = state.ui.viewing; applySwipe(pid, v); }
      else flyOut(v);
      break;
    }
    case "undo": undo(); break;
    case "exp-close": state.ui.viewing = null; render(); break;
    case "likeitem": {
      const k = el.dataset.k;
      if (state.likedItems[k]) delete state.likedItems[k]; else state.likedItems[k] = true;
      save(); render(); break;
    }

    /* match + chat */
    case "closematch": cancelPendingMatch(); state.ui.match = null; render(); break;
    case "chat": {
      const m = state.matches.find((x) => x.id === v);
      if (!m) break;
      m.unread = 0;
      state.ui.match = null; state.ui.chat = v; state.ui.chatDraft = "";
      save(); render(); break;
    }
    case "backchat": state.ui.chat = null; state.ui.chatDraft = ""; save(); render(); break;
    case "chatmenu": state.ui.chatMenuId = v; state.ui.sheet = "chatmenu"; render(); break;
    case "ice": {
      state.ui.chatDraft = el.dataset.v; save(); render();
      const c = $("#composer");
      if (c) { c.focus(); c.style.height = "auto"; c.style.height = Math.min(120, c.scrollHeight) + "px"; }
      break;
    }
    case "send": sendMsg(); break;
    case "gif": sendGif(); break;
    case "reverify": requestReverify(); break;
    case "unmatch": {
      state.matches = state.matches.filter((x) => x.id !== v);
      state.ui.chat = null; state.ui.sheet = null;
      save(); render(); toast("Unmatched"); break;
    }

    /* sheets + prefs */
    case "sheet": state.ui.sheet = v; render(); break;
    case "sheet-close": state.ui.sheet = null; render(); break;
    case "sheet-bg": if (e.target === el) { state.ui.sheet = null; render(); } break;
    case "gpref": {
      const g = v, f = state.prefs;
      const i = f.genders.indexOf(g);
      if (i !== -1) { if (f.genders.length === 1) { toast("Leave at least one option on", "info"); break; } f.genders.splice(i, 1); }
      else f.genders.push(g);
      save(); render(); break;
    }
    case "spref": state.prefs.seeking = state.prefs.seeking === v ? "any" : v; save(); render(); break;
    case "report": state.ui.reportPid = v; state.ui.sheet = "report"; render(); break;
    case "doreport": doReport(el.dataset.v, REASONS[+el.dataset.r]); break;
    case "block": blockProfile(v); break;
    case "unblock": state.blocks = state.blocks.filter((x) => x !== v); save(); render(); break;
    case "pickprompt": state.ui.pickIndex = v; state.ui.sheet = "pickprompt"; render(); break;
    case "chose": {
      const q = el.dataset.v;
      const i = el.dataset.i === "new" ? -1 : +el.dataset.i;
      if (i === -1) { if (state.me.prompts.length >= 3) { toast("Three prompts is the limit", "info"); break; } state.me.prompts.push({ q: q, a: "" }); }
      else {
        const other = state.me.prompts.findIndex((p, ix) => p.q === q && ix !== i);
        if (other !== -1) { const t = state.me.prompts[i]; state.me.prompts[i] = state.me.prompts[other]; state.me.prompts[other] = t; }
        else state.me.prompts[i] = { q: q, a: state.me.prompts[i].a };
      }
      state.ui.sheet = null; save(); render(); break;
    }
    case "limit-ok": state.ui.sheet = null; render(); break;
    case "upgrade": toast("No payments in this prototype", "info"); break;
    case "remote": state.settings.remotePhotos = !state.settings.remotePhotos; save(); render(); break;
    case "reset":
      if (!state.ui.confirmReset) { state.ui.confirmReset = true; render(); break; }
      resetAll(); break;
  }
}

function resetAll() {
  try { localStorage.removeItem(KEY); } catch (e) {}
  state = freshState();
  applyTheme();
  try { window.scrollTo(0, 0); } catch (e) {}
  render();
  toast("Demo reset", "refresh");
}

document.addEventListener("click", onClick);
document.addEventListener("click", (e) => {
  if (Date.now() - lastDragEnd < 260) return;             // a drag just ended: not a tap
  const card = e.target.closest(".dcard--top");
  if (card && !e.target.closest("[data-act]")) { state.ui.viewing = card.dataset.id; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && e.target && e.target.id === "composer") { e.preventDefault(); sendMsg(); }
  if (e.key === "Escape") {
    if (state.ui.sheet) { state.ui.sheet = null; render(); }
    else if (state.ui.match) { state.ui.match = null; render(); }
    else if (state.ui.viewing) { state.ui.viewing = null; render(); }
    else if (state.ui.chat) { state.ui.chat = null; render(); }
  }
});
/* Range inputs update state live but only re-render on release, so dragging
   does not tear the thumb out from under the pointer. */
document.addEventListener("input", (e) => {
  const r = e.target.closest("[data-r]");
  if (!r) return;
  const n = r.dataset.r, val = +r.value;
  if (n === "ageMin") state.prefs.ageMin = Math.min(val, state.prefs.ageMax);
  else if (n === "ageMax") state.prefs.ageMax = Math.max(val, state.prefs.ageMin);
  else if (n === "distance") state.prefs.distance = val;
  save();
  patchRanges();
});
document.addEventListener("change", (e) => { if (e.target.closest("[data-r]")) { save(); render(); } });

function patchRanges() {
  const f = state.prefs;
  const lo = (f.ageMin - 18) / (60 - 18) * 100, hi = (f.ageMax - 18) / (60 - 18) * 100;
  const fill = $("#ageFill");
  if (fill) { fill.style.left = lo + "%"; fill.style.right = 100 - hi + "%"; }
  const out = $("#ageOut");
  if (out) out.innerHTML = `<span class="tnum">${f.ageMin}</span><span class="tnum">${f.ageMax}</span>`;
  const dOut = $("#distOut");
  if (dOut) dOut.innerHTML = `<span>1 km</span><span class="tnum">${f.distance} km</span>`;
  const note = $("#deckCount");
  if (note) { const n = deckProfiles().length; note.textContent = `These filters change the deck immediately. ${n} profile${n === 1 ? "" : "s"} match right now.`; }
}

/* ==========================================================================
   Ticker — expiry and live countdowns
   ========================================================================== */
function tick() {
  let dirty = false;
  for (let i = state.matches.length - 1; i >= 0; i--) {
    const m = state.matches[i];
    if (!m.firstMsg && m.expires <= now()) {
      state.matches.splice(i, 1);
      state.expiredCount++;
      dirty = true;
    }
  }
  if (dirty) { save(); render(); return; }
  document.querySelectorAll("[data-exp]").forEach((el) => {
    const ms = +el.dataset.exp - now();
    el.textContent = fmtLeft(ms);
    const tone = clockTone(ms);
    el.className = "mrow__clock" + (tone ? " mrow__clock--" + tone : "");
  });
}

/* ==========================================================================
   Boot
   ========================================================================== */
load();
rollDay();
applyTheme();
render();
tick();
setInterval(tick, 1000);
</script>
